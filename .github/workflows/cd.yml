name: CD
on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          cargo build --release
      - name: Set env
        run: |
          echo "ARCHIVE=raspi-exporter-${{ github.ref_name }}-aarch64-unknown-linux-gnu" >> $GITHUB_ENV
      - name: Archive
        run: |
          mkdir "$ARCHIVE"
          cp ./target/release/raspi-exporter "$ARCHIVE"
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes "$ARCHIVE.tar.gz"
