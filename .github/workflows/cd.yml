name: CD
on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    env:
      ARCHIVE: raspi-exporter-${{ $github.ref_name }}-aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          cargo build --release
      - name: Archive
        run: |
          mkdir "${{ env.ARCHIVE }}"
          cp ./target/release/raspi-exporter "${{ env.ARCHIVE }}"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes "${{ env.ARCHIVE }}"
